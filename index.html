<script>const dimensions = [
['Posicionamento preventivo','Definir o lugar da prevenção na proposta da clínica e alinhar a comunicação da equipe.'],
['Identidade e produto preventivo','Organizar nome, identidade, público, entregas e etapas em uma proposta reconhecível.'],
['Comunicação de valor','Conectar as entregas às necessidades do paciente e verificar se ele entende o valor do acompanhamento.'],
['Entrega ao final da consulta','Criar uma devolutiva individualizada que torne visíveis o cuidado realizado e os próximos passos.'],
['Planos preventivos','Estruturar modalidades, valores e condições, preservando o cuidado individual de cada participante.'],
['Recorrência e assinatura','Organizar contratação, cobrança e acompanhamento dos cuidados previstos na assinatura.'],
['Experiência e personalização','Definir responsabilidades e conectar a avaliação individual à continuidade do cuidado.'],
['Relacionamento e indicações','Organizar os contatos entre consultas e acompanhar a origem e a experiência dos pacientes indicados.'],
['Garantias e clareza das condições','Definir e comunicar os compromissos, limites e condições da proposta preventiva.'],
['Gestão e melhoria','Acompanhar adesão, continuidade e viabilidade financeira para orientar melhorias no programa.']

const questions = [
['Qual espaço a prevenção ocupa na proposta da clínica?', ['O atendimento está concentrado em resolver problemas; a prevenção aparece eventualmente.','Falamos sobre prevenção, mas ela depende da iniciativa de cada profissional.','A prevenção faz parte da proposta da clínica e tem uma rotina definida.','A prevenção orienta nossa proposta, nossas rotinas e decisões de gestão.']],
['Como a prevenção aparece na comunicação externa?', ['Quase não aparece.','Aparece em dicas e mensagens genéricas.','Aparece com frequência, explicando nossa abordagem e como funciona.','Existe uma comunicação contínua, alinhada à experiência e revisada com base nas dúvidas dos pacientes.']],
['Como a equipe explica a proposta preventiva?', ['Não existe uma explicação definida.','Cada pessoa explica de um jeito.','A equipe utiliza uma explicação comum sobre a proposta e suas entregas.','Além do alinhamento, revisamos a comunicação e preparamos a equipe para dúvidas frequentes.']],
['Como vocês verificam se os pacientes reconhecem a prevenção como parte da identidade da clínica?', ['Não verificamos.','Consideramos comentários espontâneos.','Perguntamos de forma organizada e registramos as respostas.','Analisamos essas respostas e ajustamos a experiência e a comunicação.']],
['Sua proposta preventiva tem nome ou identidade própria?', ['Não; aparece como procedimentos avulsos.','Utilizamos uma denominação genérica, sem apresentação definida.','Temos nome e apresentação próprios, mas seu uso ainda é irregular.','Temos uma identidade reconhecível, utilizada de forma consistente pela clínica.']],
['O que existe por trás dessa identidade?', ['Não há uma proposta organizada.','Existe uma ideia ou um nome, mas as entregas ainda não estão definidas.','Existe um programa com público, entregas e etapas definidos.','O programa está definido, é aplicado de forma consistente e passa por revisões.']],
['Como o paciente conhece o programa preventivo?', ['Por uma explicação improvisada.','Por uma explicação verbal que varia conforme o profissional.','Por uma apresentação padronizada com funcionamento, entregas e condições.','Pela apresentação padronizada, adaptada às suas necessidades, com verificação da compreensão.']],
['Em quantos pontos de contato essa identidade está presente?', ['Não está presente de forma identificável.','Em materiais ou situações isoladas.','Na divulgação, na consulta e nos materiais entregues ao paciente.','Em toda a jornada, do primeiro contato ao acompanhamento, com consistência.']],
['Como vocês explicam a diferença entre o programa e uma limpeza avulsa?', ['Não fazemos essa diferenciação.','Destacamos principalmente procedimentos e preço.','Explicamos avaliação, orientação, planejamento e continuidade do cuidado.','Relacionamos essas entregas à situação do paciente e verificamos se ele entendeu.']],
['Como demonstram o valor da prevenção quando o paciente não sente dor?', ['Geralmente não abordamos esse assunto.','Dizemos que prevenir é importante.','Utilizamos os achados e registros individuais para explicar o acompanhamento.','Retomamos esses registros ao longo do tempo para explicar a evolução e os próximos passos.']],
['Como o investimento no programa é apresentado?', ['Informamos apenas o preço.','Informamos o preço e os procedimentos incluídos.','Explicamos entregas, duração, acompanhamento e condições de contratação.','Fazemos essa apresentação de forma consistente e verificamos se o paciente compreendeu o que está contratando.']],
['Como lidam com dúvidas e objeções sobre o valor da prevenção?', ['Improvisamos ou encerramos a conversa.','Respondemos individualmente, sem registrar as dúvidas.','Temos respostas alinhadas para as dúvidas mais comuns.','Registramos dúvidas recorrentes e usamos essas informações para melhorar a apresentação.']],
['O que o paciente recebe ao final da consulta preventiva?', ['Apenas orientações verbais, sem registro para levar ou consultar.','Um material genérico ou item físico, como folheto ou kit.','Uma devolutiva individualizada com orientações e próximos passos.','Uma devolutiva individualizada que integra o histórico e é retomada nos acompanhamentos.']],
['Como essa entrega é apresentada?', ['Não existe uma entrega definida.','Cada profissional utiliza seu próprio formato.','Existe um formato padrão com a identidade da clínica e espaço para personalização.','O formato é utilizado de forma consistente e revisado conforme a compreensão dos pacientes.']],
['O paciente consegue identificar o que foi realizado e o que vem a seguir?', ['Essas informações não são organizadas.','São explicadas verbalmente.','São explicadas e disponibilizadas em um registro acessível.','Além disso, confirmamos a compreensão e retomamos esse registro na consulta seguinte.']],
['Como vocês acompanham a utilização das orientações e materiais entregues?', ['Não acompanhamos.','Perguntamos eventualmente.','A utilização e as dificuldades são verificadas no retorno.','Registramos as dificuldades e adaptamos as orientações e os materiais.']],
['Como estão organizadas as modalidades de contratação?', ['Trabalhamos apenas com atendimentos avulsos, sem proposta de continuidade.','Montamos pacotes ou condições caso a caso.','Temos uma ou mais modalidades definidas, como individual, casal, família, mensal ou anual.','As modalidades têm regras claras e são revisadas conforme as necessidades dos pacientes e os resultados da clínica.']],
['Como a clínica atende casais ou famílias interessados em prevenção?', ['Não existe uma abordagem definida para essa situação.','Oferecemos principalmente descontos negociados caso a caso.','Temos uma solução definida, por plano específico ou adesões individuais coordenadas.','Além da solução definida, organizamos o acompanhamento preservando as necessidades de cada participante.']],
['Como os valores e as entregas dos planos foram definidos?', ['Não temos planos estruturados.','Principalmente por comparação de preços ou aplicação de descontos.','Considerando custos, capacidade de atendimento e entregas previstas.','Considerando esses fatores e revisando periodicamente utilização, continuidade e resultado financeiro.']],
['Como são apresentadas as condições dos planos?', ['Não estão definidas.','São combinadas verbalmente.','Inclusões, exclusões, duração e condições estão documentadas.','Estão documentadas, são explicadas antes da adesão e ficam disponíveis para consulta.']],
['Existe assinatura preventiva com mensalidade e um pacote definido de consultas?', ['Não existe e ainda não avaliamos esse modelo.','Está em estudo ou em implantação, sem funcionamento definido.','Existe e funciona com cobrança e entregas definidas.','Existe, tem operação estruturada e acompanhamos utilização, permanência e resultado financeiro.']],
['Como vocês esclarecem a diferença entre assinatura e parcelamento?', ['Essa distinção não está definida na nossa oferta.','É explicada verbalmente, conforme a dúvida aparece.','Os materiais e condições deixam claro qual modelo está sendo contratado.','Além dessa clareza, verificamos a compreensão antes da contratação.']],
['Como funcionam cobrança, renovação e cancelamento?', ['Não existem processos definidos.','São resolvidos caso a caso.','Existem regras documentadas e responsáveis definidos.','As regras são aplicadas de forma consistente e acompanhamos falhas e solicitações.']],
['Como vocês acompanham a utilização dos cuidados contratados?', ['Não acompanhamos de forma organizada.','Verificamos quando o paciente procura a clínica.','Identificamos pacientes com cuidados previstos ainda não realizados.','Entramos em contato de forma organizada e acompanhamos se esses pacientes retomam o cuidado.']],
['Como as necessidades individuais orientam o plano preventivo?', ['A oferta é praticamente igual para todos.','O profissional adapta informalmente algumas orientações.','A avaliação individual orienta um plano registrado.','O plano registrado é revisto conforme a evolução e as necessidades do paciente.']],
['Como vocês definem os próximos acompanhamentos?', ['O paciente retorna quando considera necessário.','Sugerimos retorno, sem um processo consistente de registro.','Definimos e registramos o acompanhamento conforme as necessidades individuais.','Além disso, verificamos sua realização e reavaliamos o planejamento quando necessário.']],
['Como as responsabilidades da equipe estão organizadas?', ['Não estão claras.','São conhecidas informalmente, mas há falhas frequentes.','Está definido quem apresenta, orienta, registra, agenda e acompanha.','As responsabilidades são aplicadas e revisamos as falhas de execução.']],
['Como vocês verificam se a experiência corresponde ao que foi apresentado?', ['Não verificamos.','Consideramos apenas reclamações espontâneas.','Coletamos feedback de forma organizada.','Comparamos o feedback com a proposta e corrigimos os pontos de descompasso.']],
['Como acontece a comunicação entre consultas?', ['O contato depende de o paciente procurar a clínica.','Enviamos principalmente lembretes de agendamento.','Retomamos o plano e os próximos passos nas mensagens de acompanhamento.','A comunicação considera o plano, o momento e as dificuldades registradas de cada paciente.']],
['Como a clínica acompanha pacientes que chegam por indicação?', ['Não identificamos a origem.','Perguntamos eventualmente, sem registro consistente.','Registramos a origem e temos uma rotina de acolhimento.','Também acompanhamos a adesão e a experiência dos pacientes indicados.']],
['Existe bonificação ou benefício pela indicação de novos pacientes?', ['Não existe uma decisão definida sobre isso.','Oferecemos benefícios ocasionalmente, sem critérios claros.','Temos uma decisão explícita de oferecer ou não; quando oferecemos, as regras estão documentadas.','A decisão é aplicada de forma consistente, comunicada com clareza e revisada periodicamente.']],
['Como vocês descobrem o que leva alguém a indicar a clínica?', ['Não investigamos.','Consideramos comentários espontâneos.','Perguntamos e registramos os motivos.','Analisamos os motivos e usamos os achados para aprimorar a experiência.']],
['A prevenção dá direito a alguma garantia ou benefício relacionado a outros tratamentos?', ['Não existe uma definição clara sobre esse assunto.','Fazemos combinações informais, conforme o caso.','Definimos se existe ou não essa vinculação e documentamos as condições quando aplicável.','A definição é comunicada de forma consistente e revisamos sua aplicação.']],
['Como a clínica comunica o alcance e os limites do que oferece?', ['Não explica de forma organizada.','Explica apenas quando o paciente pergunta.','Apresenta os compromissos, limites e condições antes da contratação.','Além disso, verifica a compreensão e mantém as informações disponíveis.']],
['Como a relação entre acompanhamento preventivo e eventuais benefícios é explicada?', ['Essa relação fica indefinida.','É explicada verbalmente, sem padronização.','Está documentado se existe essa relação e quais são as condições aplicáveis.','A informação é documentada, explicada e considerada no acompanhamento do paciente.']],
['Como vocês lidam com dúvidas ou solicitações sobre compromissos e garantias?', ['Resolvemos sem critérios definidos.','Dependemos da interpretação de quem atende.','Temos um processo com responsável e critérios documentados.','Registramos as solicitações, aplicamos os critérios e usamos os casos para melhorar a comunicação.']],
['Como vocês acompanham a adesão à proposta preventiva?', ['Não sabemos quantos pacientes recebem a proposta e aderem.','Temos uma percepção aproximada.','Registramos apresentações e adesões.','Analisamos esses dados regularmente e ajustamos o processo.']],
['Como vocês acompanham a continuidade dos pacientes?', ['Não acompanhamos de forma organizada.','Percebemos os abandonos quando alguém deixa de aparecer.','Temos registros de continuidade, interrupção e motivos conhecidos.','Analisamos esses registros e realizamos ações para melhorar a continuidade.']],
['Como vocês avaliam a sustentabilidade financeira da prevenção?', ['Não avaliamos separadamente.','Observamos apenas o faturamento gerado.','Acompanhamos receitas, custos e capacidade de atendimento.','Usamos esses dados para revisar preços, entregas e organização da operação.']],
['Como a clínica melhora sua proposta preventiva?', ['Não existe uma rotina de revisão.','Fazemos mudanças quando surge um problema.','Revisamos a proposta periodicamente, com base em dados e feedback.','Definimos melhorias, responsáveis e prazos e verificamos os resultados.']]

const levels = [
{name:'Prevenção pontual',headline:'A prevenção ainda depende demais de iniciativas isoladas na sua clínica.',paragraphs:['Suas respostas indicam que faltam bases para transformar a prevenção em uma proposta clara, com entregas definidas, comunicação consistente e acompanhamento organizado.','Nesse cenário, o paciente pode passar pela consulta sem compreender o valor da continuidade. E a clínica fica dependente da iniciativa de cada profissional para apresentar, entregar e retomar o cuidado.','<strong>Estruturar seu programa preventivo é uma prioridade.</strong> Adiar essa organização significa manter as lacunas que você acabou de identificar.','O primeiro passo é definir o que seu programa entrega, para quem ele faz sentido, como será apresentado e quem será responsável por cada etapa.'],next:'Buscar acompanhamento para construir as bases do programa e colocar uma primeira versão em funcionamento.',cta:'Quero estruturar meu programa preventivo'},
{name:'Prevenção em construção',headline:'Sua clínica já tem iniciativas preventivas, mas elas ainda precisam funcionar como um programa.',paragraphs:['Você já começou. Porém, suas respostas indicam que parte da prevenção ainda depende de acordos informais, ações pontuais ou explicações que variam conforme quem atende.','Isso pode fazer com que o esforço da equipe não se transforme em uma experiência consistente e reconhecida pelo paciente.','<strong>O próximo avanço é conectar o que hoje está disperso:</strong> identidade, entregas, planos, comunicação e acompanhamento.','Um programa bem estruturado dá uma direção comum a essas iniciativas. O acompanhamento da implantação ajuda a transformar as definições em rotina.'],next:'Organizar o que já existe, preencher as lacunas e estabelecer uma jornada preventiva clara.',cta:'Quero transformar minhas iniciativas em um programa'},
{name:'Prevenção estruturada',headline:'Sua clínica tem uma base preventiva. Agora precisa fazer essa estrutura funcionar de ponta a ponta.',paragraphs:['Suas respostas mostram processos definidos, mas também oportunidades de conectar melhor a apresentação da proposta, a experiência do paciente e a gestão do acompanhamento.','É possível ter bons materiais e falhas na continuidade. Ou entregar um cuidado consistente que o paciente ainda não consegue reconhecer e valorizar.','<strong>Seu programa preventivo precisa integrar essas partes.</strong> A prioridade é identificar onde a jornada perde consistência e corrigir os pontos que limitam sua execução.','Um acompanhamento de implementação e revisão pode ajudar sua equipe a transformar uma estrutura existente em um programa aplicado com regularidade.'],next:'Revisar o desenho do programa e criar um plano de melhoria para suas dimensões mais frágeis.',cta:'Quero integrar e fortalecer meu programa'},
{name:'Prevenção integrada',headline:'A prevenção já ocupa um lugar importante na sua clínica. O desafio é sustentar essa consistência.',paragraphs:['Suas respostas indicam conexão entre comunicação, entrega, relacionamento e gestão. Essa base permite uma revisão mais precisa das etapas que ainda apresentam variação.','Com mudanças na equipe, no volume de pacientes ou nas modalidades de contratação, o programa precisa continuar claro e viável.','<strong>O próximo passo é aperfeiçoar e documentar seu programa preventivo</strong>, com responsabilidades, indicadores e revisões que ajudem a preservar a qualidade da execução.','Um acompanhamento periódico pode apoiar essa evolução e ajudar a identificar lacunas que a rotina torna menos visíveis.'],next:'Revisar os pontos de menor pontuação e definir um ciclo de aperfeiçoamento do programa.',cta:'Quero aperfeiçoar meu programa preventivo'},
{name:'Prevenção avançada',headline:'Suas respostas indicam uma operação preventiva avançada. Seu próximo desafio é comprovar e sustentar essa maturidade.',paragraphs:['Você relata consistência em diferentes dimensões do programa e utiliza acompanhamento e revisão para evoluir.','Agora, vale confrontar essa percepção com evidências: o que os pacientes compreendem, como a equipe executa as etapas e quais resultados a clínica acompanha.','<strong>Seu programa preventivo merece uma revisão estratégica contínua.</strong> Se ele ainda não está formalizado como um programa único, este é o momento de reunir e documentar sua estrutura. Se já está, a prioridade é refiná-lo.','Um acompanhamento especializado pode oferecer uma leitura externa, testar a consistência dos processos e orientar os próximos avanços.'],next:'Realizar uma revisão estratégica do programa, começando pela dimensão com menor pontuação.',cta:'Quero uma revisão estratégica do meu programa'}
];
function calculateResult(answers){
 if(answers.length!==40||!Array.from(answers).every(v=>Number.isInteger(v)&&v>=0&&v<=3))throw new Error('Responda às 40 perguntas para calcular o resultado.');
 const total=answers.reduce((a,b)=>a+b,0);
 const level=total<=24?0:total<=48?1:total<=72?2:total<=96?3:4;
 const scores=dimensions.map((d,i)=>({index:i,name:d[0],action:d[1],score:answers.slice(i*4,i*4+4).reduce((a,b)=>a+b,0)}));
 const sorted=[...scores].sort((a,b)=>a.score-b.score||a.index-b.index);
 return {total,level,scores,priorities:sorted.slice(0,2),tied:sorted.filter(d=>d.score===sorted[0].score).length};
}

const main=document.querySelector('main');
let answers=Array(40).fill(null),current=-1;
let lead={name:'',phone:''};
let contactStep=0;
const leadId=crypto.randomUUID(),leadToken=crypto.randomUUID();
let saving=false;
function normalizedPhone(){const raw=lead.phone.trim(),digits=raw.replace(/\D/g,'');return raw.startsWith('+')||digits.startsWith('55')&&digits.length===13?digits:'55'+digits;}
async function saveLead(complete=false){const response=await fetch('https://cycle-maturidade-preventiva.mauriciocastello954.chatgpt.site/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:leadId,token:leadToken,name:lead.name,phone:normalizedPhone(),answers}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('Não foi possível salvar. Confira sua conexão e tente novamente.');}
function whatsappLink(r,l){const message=[`Olá, Maurício! Meu nome é ${lead.name}.`,`Meu WhatsApp: +${normalizedPhone()}.`,`Concluí o diagnóstico de maturidade preventiva: Nível ${r.level+1} — ${l.name} (${r.total}/120 pontos).`,['Quero melhorar a prevenção no meu consultório e gostaria da sua ajuda para estruturar meu programa preventivo.','Quero melhorar a prevenção no meu consultório e gostaria da sua ajuda para transformar minhas iniciativas em um programa preventivo.','Quero melhorar a prevenção no meu consultório e gostaria da sua ajuda para integrar e fortalecer meu programa preventivo.','Quero melhorar ainda mais a prevenção no meu consultório e gostaria da sua ajuda para aperfeiçoar meu programa preventivo.','Quero continuar evoluindo a prevenção no meu consultório e gostaria da sua ajuda para uma revisão estratégica do meu programa preventivo.'][r.level],'Podemos agendar uma conversa? Quais horários estão disponíveis?'].join('\n\n');return 'https://wa.me/5567996981007?text='+encodeURIComponent(message);}
function focusHeading(){const heading=main.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}
function intro(){current=-1;main.innerHTML=`<section class="intro"><div><p class="eyebrow">Diagnóstico de maturidade preventiva</p><h1>Descubra a Maturidade Preventiva <em>do seu consultório.</em></h1><p class="lead">Esse é o primeiro passo para você entender e melhorar seu processo preventivo.</p><div class="intro-actions"><button class="primary" id="start">Descobrir meu nível <span aria-hidden="true">→</span></button><span class="hint">pressione <kbd>Enter ↵</kbd></span></div><div class="intro-meta"><span>40 perguntas</span><span>10 dimensões</span><span>Seu resultado ao final</span></div></div><aside class="scale" aria-label="Cinco níveis de maturidade"><p class="scale-title">Cada estágio,<br>um próximo passo.</p><ol>${levels.map((l,i)=>`<li><b>0${i+1}</b><span>${l.name.replace('Prevenção ','')}</span></li>`).join('')}</ol><small>Um olhar sobre o programa preventivo da sua clínica.</small></aside></section>`;document.querySelector('#start').onclick=()=>contact(0);}
function question(){const [title,options]=questions[current];const dim=Math.floor(current/4);const count=answers.filter(v=>v!==null).length;main.innerHTML=`<section class="quiz"><div class="progress-head"><span>Dimensão ${dim+1} de 10</span><span>${count} de 40 respondidas · ${Math.round(count/40*100)}%</span></div><progress max="40" value="${count}" aria-label="Perguntas respondidas"></progress><div class="question-panel"><p class="question-label">${String(current+1).padStart(2,'0')} / ${dimensions[dim][0]}</p><h2 class="question-title" id="question-title">${title}</h2><p class="question-note" id="question-note">Escolha o que acontece hoje. Se trabalha sozinho, considere sua própria atuação.</p><div class="choices" role="radiogroup" aria-labelledby="question-title" aria-describedby="question-note">${options.map((text,i)=>`<button class="option" role="radio" aria-checked="${answers[current]===i}" data-value="${i}" tabindex="${answers[current]===i||(answers[current]===null&&i===0)?0:-1}"><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span>${text}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div><div class="quiz-nav"><button class="text-button" id="back">← ${current===0?'Seus dados':'Voltar'}</button><div class="nav-next"><span class="hint">A–D para escolher · <kbd>Enter ↵</kbd></span><button class="primary" id="next" ${answers[current]===null?'disabled':''}>${current===39?'Ver meu resultado':'Continuar'} <span aria-hidden="true">→</span></button></div></div></div></section>`;
 main.querySelectorAll('.option').forEach(b=>b.onclick=()=>select(Number(b.dataset.value)));
 document.querySelector('#back').onclick=()=>{if(saving)return;if(current===0){contact(1);}else{current--;question();}};
 document.querySelector('#next').onclick=next;focusHeading();}
function select(value){if(saving)return;answers[current]=value;main.querySelectorAll('.option').forEach((b,i)=>{b.setAttribute('aria-checked',String(i===value));b.tabIndex=i===value?0:-1;});document.querySelector('#next').disabled=false;const count=answers.filter(v=>v!==null).length;main.querySelector('.progress-head span:last-child').textContent=`${count} de 40 respondidas · ${Math.round(count/40*100)}%`;main.querySelector('progress').value=count;}
async function next(){if(saving||current<0||current>39||answers[current]===null)return;if(current===39){result();return;}saving=true;const button=document.querySelector('#next');button.disabled=true;button.textContent='Salvando…';let error=document.querySelector('#save-error');if(!error){error=document.createElement('p');error.id='save-error';error.setAttribute('role','alert');main.querySelector('.quiz').append(error);}error.textContent='';try{await saveLead();current++;question();}catch(e){error.textContent=e.message;button.disabled=false;button.textContent='Tentar novamente';}finally{saving=false;}}
function dimensionLabel(n){return n<=3?'Prioridade de desenvolvimento':n<=6?'Em construção':n<=9?'Estruturada':'Consolidada';}
async function result(){if(saving)return;saving=true;const button=document.querySelector('#next');button.disabled=true;button.textContent='Salvando resultado…';let error=document.querySelector('#save-error');if(!error){error=document.createElement('p');error.id='save-error';error.setAttribute('role','alert');main.querySelector('.quiz').append(error);}error.textContent='';try{await saveLead(true);}catch(e){error.textContent=e.message;button.disabled=false;button.textContent='Tentar novamente';saving=false;return;}saving=false;const r=calculateResult(answers),l=levels[r.level];current=40;const perfect=r.total===120;main.innerHTML=`<section class="result"><div class="result-top"><div><p class="eyebrow">Seu diagnóstico · Nível ${r.level+1} de 5</p><h1>${l.name}</h1></div><div class="score" style="--fill:${r.total/120*100}%" aria-label="${r.total} de 120 pontos"><div class="score-inner"><strong>${r.total}</strong><small>de 120 pontos</small></div></div></div><div class="result-copy"><h2>${l.headline}</h2>${l.paragraphs.map(p=>`<p>${p}</p>`).join('')}</div><p class="question-label">${perfect?'Onde começar sua revisão':'Suas oportunidades prioritárias'}</p>${r.tied>2?`<p class="hint">${perfect?'Todas as dimensões atingiram a pontuação máxima. Confira na prática a consistência das respostas.':`${r.tied} dimensões empataram na menor pontuação. Destacamos duas, na ordem do diagnóstico, para começar.`}</p>`:''}<div class="priorities">${r.priorities.map((d,i)=>`<article class="priority"><p class="eyebrow">${perfect?'Revisão':'Prioridade'} 0${i+1}</p><h3>${d.name}</h3><p class="points">${d.score} de 12 pontos · ${dimensionLabel(d.score)}</p><p>${perfect?'Revisar as evidências de execução e identificar oportunidades de aperfeiçoamento nesta dimensão.':d.action}</p></article>`).join('')}</div><details class="breakdown" open><summary>Seu resultado nas 10 dimensões</summary><div class="dimension-grid">${r.scores.map(d=>`<div class="dimension"><div class="dimension-head"><span>${d.name}</span><b>${d.score}/12</b></div><progress max="12" value="${d.score}" aria-label="${d.name}: ${d.score} de 12 pontos"></progress><small>${dimensionLabel(d.score)}</small></div>`).join('')}</div></details><section class="next-step"><p class="eyebrow">Seu próximo ciclo</p><h2>Um programa com a sua marca.<br><em>Construído com você.</em></h2><p>${l.next}</p><p>Na CYCLE, você conta com acompanhamento individual de Maurício Castello para estruturar e aperfeiçoar seu programa preventivo, da estratégia à implementação.</p><a class="primary" href="${whatsappLink(r,l)}" target="_blank" rel="noopener noreferrer">${l.cta} <span aria-hidden="true">↗</span></a><p class="hint">Seu contato e resultado foram salvos. O botão abre o WhatsApp com uma mensagem pronta; toque em enviar para solicitar seu agendamento.</p></section><div class="result-bottom"><button class="text-button" id="review">← Revisar minhas respostas</button></div><p class="method">Este diagnóstico considera suas próprias respostas sobre a estrutura do modelo preventivo. A = 0, B = 1, C = 2 e D = 3 pontos. Faixas: 0–24, 25–48, 49–72, 73–96 e 97–120. É uma ferramenta de reflexão e desenvolvimento, sem validação científica; não avalia a qualidade clínica do atendimento.</p></section>`;
 document.querySelector('#review').onclick=()=>{current=0;question();};focusHeading();}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(current===-1&&e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();contact(0);return;}if(current<0||current>=40)return;const letter='abcd'.indexOf(e.key.toLowerCase());if(letter>=0&&e.key.length===1){e.preventDefault();select(letter);main.querySelectorAll('.option')[letter].focus();return;}if(e.key==='Enter'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'){e.preventDefault();next();}else if(e.key==='Enter'&&e.target.classList.contains('option')){e.preventDefault();next();}if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)&&e.target.classList.contains('option')){e.preventDefault();const delta=e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1;const value=(Number(e.target.dataset.value)+delta+4)%4;select(value);main.querySelectorAll('.option')[value].focus();}});
function contact(step){
 current=-2;contactStep=step;
 main.innerHTML=`<section class="quiz contact"><p class="eyebrow">Antes de começar · ${step+1} de 2</p><form id="contact-form"><h2 class="question-title"><label for="lead-input">${step===0?'Como você se chama?':'Qual é o seu WhatsApp?'}</label></h2><p class="question-note" id="lead-help">${step===0?'Vamos identificar seu diagnóstico.':'Informe o número com DDD. Para outro país, inclua + e o código do país.'}</p><input id="lead-input" name="${step===0?'name':'tel'}" type="${step===0?'text':'tel'}" autocomplete="${step===0?'name':'tel'}" ${step===1?'inputmode="tel"':''} maxlength="${step===0?100:25}" required aria-describedby="lead-help lead-error" placeholder="${step===0?'Seu nome':'(65) 99999-9999'}"><p id="lead-error" role="alert"></p><p class="hint contact-notice">Ao continuar, seu nome e WhatsApp serão salvos pela CYCLE para contato sobre seu programa preventivo. Suas respostas serão salvas a cada avanço e o resultado será associado ao contato ao concluir.</p><div class="quiz-nav"><button class="text-button" type="button" id="contact-back">← Voltar</button><button class="primary" type="submit">${step===0?'Continuar':'Começar diagnóstico'} <span aria-hidden="true">→</span></button></div></form></section>`;
 const input=document.querySelector('#lead-input');input.value=step===0?lead.name:lead.phone;
 document.querySelector('#contact-back').onclick=()=>{if(saving)return;if(step===0){intro();focusHeading();}else contact(0);};
 document.querySelector('#contact-form').onsubmit=async e=>{e.preventDefault();if(saving)return;const value=input.value.trim();let error='';if(step===0){if(value.length<2||!/[\p{L}]/u.test(value))error='Informe seu nome para continuar.';}else{const digits=value.replace(/\D/g,'');if(!/^[+\d\s().-]+$/.test(value)||!(value.startsWith('+')?digits.length>=10&&digits.length<=15:digits.length===10||digits.length===11||digits.startsWith('55')&&digits.length===13))error='Informe um WhatsApp válido com DDD.';}document.querySelector('#lead-error').textContent=error;input.setAttribute('aria-invalid',String(!!error));if(error){input.focus();return;}if(step===0){lead.name=value;contact(1);}else{lead.phone=value;saving=true;const submit=e.currentTarget.querySelector('[type=submit]');submit.disabled=true;submit.textContent='Salvando…';try{await saveLead();current=0;question();}catch(err){document.querySelector('#lead-error').textContent=err.message;submit.disabled=false;submit.textContent='Tentar novamente';}finally{saving=false;}}};
 focusHeading();input.focus({preventScroll:true});
}

intro();
</script></body></html>
